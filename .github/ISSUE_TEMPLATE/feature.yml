name: Feature request
description: Something Rex could do better. Rex stays watch-only.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Rex do? It never runs, approves or steers the agent (see AGENTS.md).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
